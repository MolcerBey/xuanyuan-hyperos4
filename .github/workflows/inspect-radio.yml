name: Inspect stock Turkey modem and IMS profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - inspect_radio.py
      - test_radio.py
      - inspect_radio_partitions.py
      - download_global_donor.py
      - global-donor.json
      - .github/workflows/inspect-radio.yml
permissions:
  contents: read
concurrency:
  group: molcer-radio-inspection
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [china, global]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test inspection boundaries
        run: python3 -m unittest -v test_radio test_extraction
      - name: Authenticate pinned Xiaomi source
        if: matrix.source == 'china'
        run: python3 download_base.py
      - name: Authenticate global donor with pinned Xiaomi certificate
        if: matrix.source == 'global'
        run: python3 download_global_donor.py
      - name: Inspect read-only mounted source images
        run: sudo python3 inspect_radio_partitions.py
      - name: Unmount inspection images
        if: always()
        run: |
          for part in modem vendor odm product system system_ext; do
            if mountpoint -q "work/mounted_$part"; then sudo umount "work/mounted_$part"; fi
          done
      - name: Upload radio evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: molcer-radio-static-reports-${{ matrix.source }}
          path: |
            reports/radio-static.json
            reports/verified-base.json
            reports/verified-global-donor.json
            reports/extracted-images.json
          retention-days: 7
