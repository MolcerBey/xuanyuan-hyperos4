name: Inspect product partition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xuanyuan-product-inspection
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install filesystem inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y erofs-utils aapt lz4
      - name: Verify extraction code
        run: python3 -m unittest -v test_inspection test_extraction test_root
      - name: Verify source
        run: python3 download_base.py
      - name: Extract and verify product image
        id: extract
        run: python3 extract_partition.py --partitions product system system_ext boot init_boot
      - name: Read product package inventory
        run: |
          for part in product system system_ext; do
            mkdir -p "work/mounted_$part"
            sudo mount -t erofs -o loop,ro "work/images/$part.img" "work/mounted_$part"
            sudo python3 inventory_product.py "$part" "$ANDROID_HOME/build-tools/37.0.0/aapt2"
            sudo umount "work/mounted_$part"
          done
      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xuanyuan-product-inventory
          path: reports/
          retention-days: 7
      - name: Prepare offline KernelSU Next candidate
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        run: python3 prepare_root.py
      - name: Upload root preparation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: molcer-os-root-candidate-not-installable
          path: |
            out/root-candidate/
            reports/root-candidate.json
          retention-days: 7
          if-no-files-found: warn
