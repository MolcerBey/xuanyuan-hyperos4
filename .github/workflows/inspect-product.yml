name: Inspect product partition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - base.json
      - download_base.py
      - verify_signature.py
      - extract_partition.py
      - inventory_product.py
      - .github/workflows/inspect-product.yml
permissions:
  contents: read
concurrency:
  group: xuanyuan-product-inspection
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install filesystem inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y erofs-utils aapt
      - name: Verify extraction code
        run: python3 -m unittest -v test_inspection test_extraction
      - name: Verify source
        run: python3 download_base.py
      - name: Extract and verify product image
        run: python3 extract_partition.py --partitions product
      - name: Read product package inventory
        run: |
          mkdir -p work/mounted_product
          sudo mount -t erofs -o loop,ro work/images/product.img work/mounted_product
          python3 inventory_product.py
          sudo umount work/mounted_product
      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xuanyuan-product-inventory
          path: reports/
          retention-days: 7
